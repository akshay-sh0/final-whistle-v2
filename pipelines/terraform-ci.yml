trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/**
      - pipelines/terraform-ci.yml

pr:
  branches:
    include:
      - main

variables:
  azureServiceConnection: "sc-finalwhistle-v2-dev-wif"
  azureSubscriptionId: "4cfb5d08-807a-4d6b-b4b1-e2efab75eb49"
  PIP_CACHE_DIR: "$(Pipeline.Workspace)/.pip"

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Plan
    displayName: Terraform plan
    jobs:
      - job: ValidateAndPlan
        displayName: Validate and create plan
        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform 1.14.2
            inputs:
              terraformVersion: "1.14.2"

          - script: terraform version
            displayName: Verify Terraform installation

          - task: Cache@2
            displayName: Restore Checkov package cache
            inputs:
              key: 'pip | "$(Agent.OS)" | "checkov-3.3.17"'
              restoreKeys: |
                pip | "$(Agent.OS)"
              path: $(PIP_CACHE_DIR)

          - script: |
              python -m pip install \
                --disable-pip-version-check \
                --cache-dir "$(PIP_CACHE_DIR)" \
                checkov==3.3.17
              checkov --version
            displayName: Install Checkov 3.3.17

          - task: AzureCLI@2
            displayName: Verify Azure authentication
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                actual_subscription_id=$(az account show --query id --output tsv)
                test "$actual_subscription_id" = "$(azureSubscriptionId)"
                az account show --query "{name:name,id:id}" --output table

          - script: |
              test -f providers.tf
              terraform fmt -check -recursive
            displayName: Check Terraform formatting
            workingDirectory: $(Build.SourcesDirectory)/infra

          - script: terraform init -backend=false -input=false -lockfile=readonly
            displayName: Initialize Terraform for validation
            workingDirectory: $(Build.SourcesDirectory)/infra

          - script: terraform validate -no-color
            displayName: Validate Terraform configuration
            workingDirectory: $(Build.SourcesDirectory)/infra

          - script: |
              set -euo pipefail
              test -f main.tf
              terraform init -backend=false -input=false -lockfile=readonly
              terraform validate -no-color
            displayName: Validate Terraform bootstrap configuration
            workingDirectory: $(Build.SourcesDirectory)/infra/bootstrap

          - script: |
              set -euo pipefail

              checkov_exit_code=0
              checkov -d . --framework terraform --output json > checkov-results.json || checkov_exit_code=$?

              test -s checkov-results.json

              resource_count=$(jq -r '.summary.resource_count // 0' checkov-results.json)
              parsing_errors=$(jq -r '.summary.parsing_errors // 0' checkov-results.json)

              echo "Checkov scanned $resource_count Terraform resources."
              jq '.summary' checkov-results.json

              if [ "$resource_count" -eq 0 ]; then
                echo "Security scan failed because Checkov scanned zero resources."
                exit 1
              fi

              if [ "$parsing_errors" -gt 0 ]; then
                echo "Security scan failed because Checkov found parsing errors."
                exit 1
              fi

              exit "$checkov_exit_code"
            displayName: Scan Terraform security
            workingDirectory: $(Build.SourcesDirectory)/infra

          - task: AzureCLI@2
            displayName: Verify Terraform remote state
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Build.SourcesDirectory)/infra
              inlineScript: |
                set -euo pipefail
                terraform init -reconfigure -input=false -lockfile=readonly
                terraform state list > state-resources.txt
                test -s state-resources.txt
                grep -Fx "azurerm_resource_group.main" state-resources.txt
                grep -Fx "azurerm_static_web_app.main" state-resources.txt
                cat state-resources.txt

          - task: AzureCLI@2
            displayName: Create Terraform plan
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Build.SourcesDirectory)/infra
              inlineScript: |
                set -euo pipefail
                terraform plan -input=false -no-color -out=finalwhistle.tfplan

          - publish: $(Build.SourcesDirectory)/infra/finalwhistle.tfplan
            artifact: terraform-plan
            displayName: Publish Terraform plan

  - stage: Apply
    displayName: Terraform apply
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyTerraform
        displayName: Apply approved Terraform plan
        environment: finalwhistle-v2-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform 1.14.2
                  inputs:
                    terraformVersion: "1.14.2"

                - task: AzureCLI@2
                  displayName: Apply Terraform plan
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: $(Build.SourcesDirectory)/infra
                    inlineScript: |
                      set -euo pipefail

                      actual_subscription_id=$(az account show --query id --output tsv)
                      test "$actual_subscription_id" = "$(azureSubscriptionId)"

                      terraform init -reconfigure -input=false -lockfile=readonly
                      terraform apply -input=false "$(Pipeline.Workspace)/terraform-plan/finalwhistle.tfplan"

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/**
      - pipelines/terraform-ci.yml

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: TerraformInstaller@1
    displayName: Install Terraform 1.14.2
    inputs:
      terraformVersion: "1.14.2"

  - script: terraform version
    displayName: Verify Terraform installation

  - script: |
      test -f providers.tf
      terraform fmt -check -recursive
    displayName: Check Terraform formatting
    workingDirectory: $(Build.SourcesDirectory)/infra

  - script: terraform init -backend=false -input=false -lockfile=readonly
    displayName: Initialize Terraform for validation
    workingDirectory: $(Build.SourcesDirectory)/infra

  - script: terraform validate -no-color
    displayName: Validate Terraform configuration
    workingDirectory: $(Build.SourcesDirectory)/infra
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - site/**
      - src/**
      - scripts/**
      - pyproject.toml
      - pipelines/site-deploy.yml

pr: none

schedules:
  - cron: "0 */4 * * *"
    displayName: Refresh standings every four hours
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    displayName: Use Python 3.12
    inputs:
      versionSpec: "3.12"

  - script: python -m pip install .
    displayName: Install project dependencies

  - script: python scripts/build_current_standings.py
    displayName: Refresh current standings
    env:
      FOOTBALL_DATA_API_TOKEN: $(footballDataApiToken)

  - script: |
      set -e

      test -s site/index.html
      test -s site/styles.css
      test -s site/app.js
      test -s site/favicon.svg

      test -s site/data/history/premier-league.json
      test -s site/data/history/la-liga.json
      test -s site/data/standings/PL.json
      test -s site/data/standings/PD.json
      test -s site/data/standings/metadata.json

      python3 -m json.tool site/data/history/premier-league.json > /dev/null
      python3 -m json.tool site/data/history/la-liga.json > /dev/null
      python3 -m json.tool site/data/standings/PL.json > /dev/null
      python3 -m json.tool site/data/standings/PD.json > /dev/null
      python3 -c 'import json; from datetime import datetime; value=json.load(open("site/data/standings/metadata.json"))["updated_at"]; datetime.fromisoformat(value.replace("Z", "+00:00"))'

      echo "Website files are valid."
    displayName: Validate website files

  - task: AzureCLI@2
    displayName: Get Static Web App deployment token
    inputs:
      azureSubscription: sc-finalwhistle-v2-dev-wif
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        deployment_token=$(az staticwebapp secrets list \
          --name stapp-finalwhistle-v2-dev \
          --resource-group rg-finalwhistle-v2-dev \
          --query "properties.apiKey" \
          --output tsv)

        test -n "$deployment_token"

        echo "##vso[task.setvariable variable=staticWebAppToken;issecret=true]$deployment_token"

  - task: AzureStaticWebApp@0
    displayName: Deploy website
    inputs:
      app_location: "site"
      output_location: ""
      skip_app_build: true
      skip_api_build: true
      azure_static_web_apps_api_token: $(staticWebAppToken)

  - script: |
      set -euo pipefail

      site_url="https://lively-smoke-0de52a703.5.azurestaticapps.net"
      home_file="$(Agent.TempDirectory)/final-whistle-home.html"
      pl_file="$(Agent.TempDirectory)/final-whistle-pl.json"
      pd_file="$(Agent.TempDirectory)/final-whistle-pd.json"
      metadata_file="$(Agent.TempDirectory)/final-whistle-metadata.json"

      expected_updated_at=$(python3 -c 'import json; print(json.load(open("site/data/standings/metadata.json"))["updated_at"])')

      curl --fail --silent --show-error --location \
        --retry 3 --retry-delay 5 --max-time 30 \
        --output "$home_file" \
        "$site_url/"

      curl --fail --silent --show-error --location \
        --retry 3 --retry-delay 5 --max-time 30 \
        --output "$pl_file" \
        "$site_url/data/standings/PL.json"

      curl --fail --silent --show-error --location \
        --retry 3 --retry-delay 5 --max-time 30 \
        --output "$pd_file" \
        "$site_url/data/standings/PD.json"

      live_updated_at=""

      for attempt in 1 2 3 4 5; do
        curl --fail --silent --show-error --location \
          --retry 3 --retry-delay 5 --max-time 30 \
          --output "$metadata_file" \
          "$site_url/data/standings/metadata.json?build=$(Build.BuildId)"

        live_updated_at=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["updated_at"])' "$metadata_file")

        if [ "$live_updated_at" = "$expected_updated_at" ]; then
          break
        fi

        echo "Waiting for the latest metadata deployment: attempt $attempt of 5."
        sleep 10
      done

      test -s "$home_file"
      grep -Fq "<title>Final Whistle</title>" "$home_file"
      python3 -m json.tool "$pl_file" > /dev/null
      python3 -m json.tool "$pd_file" > /dev/null

      if [ "$live_updated_at" != "$expected_updated_at" ]; then
        echo "Live metadata does not match the current pipeline build."
        echo "Expected: $expected_updated_at"
        echo "Live: $live_updated_at"
        exit 1
      fi

      echo "Live website contains the latest standings update: $live_updated_at"
      echo "Live website smoke test passed."
    displayName: Verify live website

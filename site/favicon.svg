<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient
      id="pitch"
      x1="18"
      y1="14"
      x2="112"
      y2="116"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#0f5132"/>
      <stop offset="1" stop-color="#063d27"/>
    </linearGradient>

    <radialGradient id="pitch-light" cx="50%" cy="47%" r="60%">
      <stop stop-color="#61c889" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#61c889" stop-opacity="0"/>
    </radialGradient>

    <filter id="fw-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur"/>
      <feFlood
        flood-color="#96efb7"
        flood-opacity="0.3"
        result="glow-color"
      />
      <feComposite
        in="glow-color"
        in2="blur"
        operator="in"
        result="glow"
      />
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="29" fill="url(#pitch)"/>

  <rect
    x="8.75"
    y="8.75"
